    const tr = e.target.closest('tr[data-href]');
    if (tr) location.hash = tr.dataset.href;
  });
}

/* One row's worth of facts, gathered from the newest version. */
function rowData(tk, name, versions) {
  const {version, vd, keys} = newestVersion(versions);
  const dd = vd.dd || {};
  return {
    tk, name, version, vd, versions, keys,
    href: assetHref(tk, name, version),
    modality: (vd.facets?.modality || []),
    institution: (dd.institution||{}).abbreviation || (dd.institution||{}).name || '',
    created: String(dd.creation_time||'').slice(0,10),
    scales: (vd.manifest?.scales || []).map(s => Array.isArray(s) ? s.join('×') : s).join(', '),
    project: dd.project_name || '',
  };
}

/* Column set for a type. Modality describes how a volume was imaged, which
   is a property of the template — the other types inherit one in their
   metadata, but showing it there is noise. Beyond that, a column that is
   empty for every row of this type is dropped rather than left blank. */
const LIST_COLS = [
  {key:'status',      label:'',            cls:'c-st',   always:true,
   cell:r=>statusCell(r.vd)},
  {key:'name',        label:'Asset',       cls:'c-name', always:true,
   cell:r=>`<a class="row-link" href="${esc(r.href)}">${esc(r.name)}</a>`},
  {key:'modality',    label:'Modality',    cls:'c-mod',  only:['atlases','templates'],
   value:r=>r.modality.join(' '),
   cell:r=>r.modality.map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')},
  {key:'project',     label:'Project',     cls:'c-dim',
   value:r=>r.project, cell:r=>esc(r.project)},
  {key:'institution', label:'Institution', cls:'c-dim',
   value:r=>r.institution, cell:r=>esc(r.institution)},
  {key:'created',     label:'Created',     cls:'c-dim c-num',
   value:r=>r.created, cell:r=>esc(r.created)},
  {key:'scales',      label:'Scales',      cls:'c-dim c-num',
   value:r=>r.scales, cell:r=>esc(r.scales)},
  {key:'versions',    label:'Versions',    cls:'c-vers', always:true,
   cell:r=>r.keys.map(v=>{
     const vv = r.versions[v].val || {};
     const cls = vv.errors?.length ? 've' : vv.warnings?.length ? 'vw' : '';
     return `<a class="vpill ${cls}" href="${esc(assetHref(r.tk,r.name,v))}"
       title="Open ${esc(r.name)} ${esc(v)}">${esc(v)}</a>`;
   }).join('')},
];

function listColumns(tk, rows) {
  return LIST_COLS.filter(c => {
    if (c.only && !c.only.includes(tk)) return false;
    if (c.always || !c.value) return true;
    return rows.some(r => String(c.value(r) ?? '').trim() !== '');
  });
}

/* Search also looks at the metadata shown in the row, not just the name. */
function rowMatchesText(versions, q) {
  const vd = newestVersion(versions).vd;
  const f = vd.facets || {};
  const hay = [...(f.modality||[]), ...(f.institution||[]), ...(f.project||[]),
               ...(f.investigator||[]), ...(f.year||[])].join(' ').toLowerCase();
  return hay.includes(q);
}

function newestVersion(versions) {
  const keys = Object.keys(versions).sort((a,b)=>cmpVersion(b,a));
  return {version: keys[0], vd: versions[keys[0]], keys};
}

function statusCell(vd) {
  const v = vd.val || {errors:[],warnings:[]};
  if (v.errors.length)   return `<span class="st-e" title="${v.errors.length} errors">✗</span>`;
  if (v.warnings.length) return `<span class="st-w" title="${v.warnings.length} warnings">⚠</span>`;
  return '<span class="st-ok" title="No findings">✓</span>';
}

const assetHref = (tk,name,version) =>
  '#/' + [tk,name,version].map(encodeURIComponent).join('/');

/* ── One asset, one page ─────────────────────────────────────────── */
function renderAssetPage(data) {
  const el = document.getElementById('main');
  const tk = st.sel;
  const {name, version} = st.asset;
  const versions = data.tree[tk]?.[name];
  if (!versions) { st.asset = null; return renderList(data); }
  const vd = versions[version];
  const keys = Object.keys(versions).sort((a,b)=>cmpVersion(b,a));
  const m = TYPE_META[tk]||{label:tk};
  const val = vd.val || {errors:[],warnings:[]};

  const status = val.errors.length
      ? `<span class="pill e">${val.errors.length} error${val.errors.length===1?'':'s'}</span>`
    : val.warnings.length
      ? `<span class="pill w">${val.warnings.length} warning${val.warnings.length===1?'':'s'}</span>`
      : '<span class="pill ok">✓ valid</span>';

  el.innerHTML = `
    <nav class="crumbs">
      <a href="#/${esc(tk)}">${esc(m.label)}</a><span class="crumb-sep">/</span>
      <span class="crumb-cur">${esc(name)}</span>
    </nav>
    <div class="asset-hd">
      <h2 class="asset-title">${esc(name)}</h2>
      ${status}
      <div class="vpills">${keys.map(v=>`<a class="vpill ${
        versions[v].val?.errors?.length?'ve':versions[v].val?.warnings?.length?'vw':''
      } ${v===version?'sel':''}" href="${esc(assetHref(tk,name,v))}">${esc(v)}</a>`).join('')}</div>
    </div>
    <div class="asset-path">${locationLink(`${tk}/${name}/${version}`)}</div>
    ${body(tk, name, version, vd)}`;
  document.getElementById('main').scrollTop = 0;
}

/* Compare version strings segment-wise so 2026-03 > 2024-05 and
   10.0.0 > 9.0.0 (a plain lexicographic sort gets both backwards). */
function cmpVersion(a, b) {
  const seg = s => s.split(/[.\-_]/).map(p => /^\d+$/.test(p) ? +p : p);
  const A = seg(a), B = seg(b);
  for (let i = 0; i < Math.max(A.length, B.length); i++) {
    const x = A[i], y = B[i];
    if (x === undefined) return -1;
    if (y === undefined) return 1;
    if (x === y) continue;
    return (typeof x === 'number' && typeof y === 'number')
      ? x - y
      : String(x).localeCompare(String(y));
  }
  return 0;
}

function body(tk, name, version, vd) {
  const val     = vd.val||{errors:[],warnings:[]};
  const details = vd.details||[];
  const mf      = vd.manifest;

  // Contents reads as a small file browser: the version directory at the
  // top, its entries beneath. Text files are buttons that open a preview.
  const dir = `${tk}/${name}/${version}`;
  const entries = [...details].sort((a,b)=>
    (a.absent?1:0)-(b.absent?1:0) ||        // missing required entries last
    (b.is_dir?1:0)-(a.is_dir?1:0) ||        // directories before files
    a.name.localeCompare(b.name));

  const frows = entries.map(f=>{
    // left icon says what the entry is; the status glyph says whether it
    // is actually there, so the two readings stay separate
    const ico = `<span class="fico${f.absent?' abs':''}">${f.is_dir?'📁':'📄'}</span>`;
    const stat = f.absent
      ? '<span class="fstat e" title="Missing">✗</span>'
      : '<span class="fstat ok" title="Present">✓</span>';
    const role = f.absent
      ? '<span class="frole rm">required</span>'
      : f.role==='extra'
        ? '<span class="frole" style="color:var(--warn)">extra</span>'
        : `<span class="frole">${esc(f.role)}</span>`;
    const label = esc(f.name + (f.is_dir ? '/' : ''));
    const nameEl = isPreviewable(f)
      ? `<button type="button" class="fname" data-preview="${esc(dir+'/'+f.name)}"
           data-fname="${esc(f.name)}" title="Preview ${esc(f.name)}">${label}</button>`
      : `<span class="fname${f.absent?' abs':''}">${label}</span>`;
    return `<div class="frow">${ico}${nameEl}${stat}${role}</div>`;
  }).join('');

  const browser = `<div class="fb">
      <div class="fb-root"><span class="fb-ico">📂</span>
        <span class="fb-path">${esc(dir)}/</span></div>
      <div class="flist">${frows}</div>
    </div>`;

  const findings = [
    ...val.errors.map(e=>`<div class="finding e"><span>✗</span>${esc(e)}</div>`),
    ...val.warnings.map(w=>`<div class="finding w"><span>⚠</span>${esc(w)}</div>`),
  ].join('');

  const dd = vd.dd;
  return `
    ${dd?.data_summary ? `<p class="lede">${esc(dd.data_summary)}</p>` : ''}
    ${dd ? renderChips(vd) : ''}
    ${renderNgLinks(tk, name, version, vd)}
    ${renderTerminologyPanel(tk, name, version, vd)}
    <div class="cols">
      <div>
        <div class="sec-lbl">Contents</div>
        ${browser}
        ${findings?`<div class="findings" title="Checked against atlas-assets spec v${SPEC_VERSION}">${findings}</div>`:''}
      </div>
      <div>
        <div class="sec-lbl">Manifest</div>
        ${mf ? renderMf(mf) : '<span style="font-size:12px;color:var(--ink-3)">Not available</span>'}
      </div>
      <div>
        <div class="sec-lbl">Provenance</div>
        ${dd ? renderProv(dd) : '<span style="font-size:12px;color:var(--ink-3)">No data_description.json</span>'}
      </div>
    </div>`;
}

/* ── File preview ────────────────────────────────────────────────────
   Text files in the Contents browser open in a dialog: JSON pretty-printed
   and lightly coloured, CSV as a table. Binary volumes are not previewable
   and stay plain text in the listing. */
const PREVIEWABLE = new Set(['json','csv','tsv','txt','md','log','yaml','yml','cff']);
const extOf = n => String(n).toLowerCase().split('.').pop();
const isPreviewable = f => !f.is_dir && !f.absent && PREVIEWABLE.has(extOf(f.name));

const previewCache = new Map();
const fmtBytes = n => n < 1024 ? `${n} B`
  : n < 1048576 ? `${(n/1024).toFixed(1)} KB` : `${(n/1048576).toFixed(1)} MB`;

/* Colour JSON after escaping, so the markup can never come from the file. */
function highlightJSON(text) {
  return esc(text).replace(
    /(&quot;(?:\\.|[^\\&]|&(?!quot;))*&quot;)(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g,
    (m, str, colon, lit) => {
      if (str) return `<span class="${colon ? 'k' : 's'}">${str}</span>${colon || ''}`;
      if (lit) return `<span class="b">${m}</span>`;
      return `<span class="n">${m}</span>`;
    });
}

const MAX_CSV_ROWS = 500;

function renderPreviewBody(name, text) {
  const ext = extOf(name);
  if (ext === 'json') {
    try {
      return `<pre class="pv-pre">${highlightJSON(JSON.stringify(JSON.parse(text), null, 2))}</pre>`;
    } catch {
      return `<pre class="pv-pre">${esc(text)}</pre>`;   // show it as-is if invalid
    }
  }
  if (ext === 'csv' || ext === 'tsv') {
    const rows = parseCSV(text).filter(r => r.length && !(r.length === 1 && r[0] === ''));
    if (!rows.length) return '<div class="pv-note">Empty file.</div>';
    const [head, ...body] = rows;
    const shown = body.slice(0, MAX_CSV_ROWS);
    const cell = v => `<td title="${esc(v)}">${esc(v)}</td>`;
    return `<table class="pv-tbl">
        <thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${shown.map(r=>`<tr>${r.map(cell).join('')}</tr>`).join('')}</tbody>
      </table>
      <div class="pv-note">${body.length.toLocaleString()} rows${
        body.length > shown.length ? ` — showing the first ${MAX_CSV_ROWS.toLocaleString()}` : ''
      } · ${head.length} columns</div>`;
  }
  return `<pre class="pv-pre">${esc(text)}</pre>`;
}

function previewDialog() {
  let d = document.getElementById('pv-dlg');
  if (d) return d;
  d = document.createElement('dialog');
  d.id = 'pv-dlg'; d.className = 'pv-dlg';
  d.innerHTML = `<div class="pv-hd">
      <span class="fb-ico">📄</span>
      <span class="pv-name"></span><span class="pv-meta"></span>
      <span class="pv-actions">
        <a class="pv-raw" target="_blank" rel="noopener">Raw</a>
        <button type="button" class="pv-close" aria-label="Close">×</button>
      </span>
    </div><div class="pv-body"></div>`;
  document.body.appendChild(d);
  d.querySelector('.pv-close').addEventListener('click', ()=>d.close());
  // Click on the backdrop (outside the panel) closes it.
  d.addEventListener('click', e => { if (e.target === d) d.close(); });
  return d;
}

async function openPreview(path, name) {
  const d = previewDialog();
  d.querySelector('.pv-name').textContent = name;
  d.querySelector('.pv-meta').textContent = '';
  d.querySelector('.pv-raw').href = storeUrl(path);
  const body = d.querySelector('.pv-body');
  body.innerHTML = '<div class="pv-note">Loading…</div>';
  if (!d.open) d.showModal();

  try {
    let entry = previewCache.get(path);
    if (!entry) {
      const r = await fetch(storeUrl(path), FRESH);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const text = await r.text();
      entry = {text, bytes: new Blob([text]).size};
      previewCache.set(path, entry);
    }
    // A slow file may have been closed, or another opened, meanwhile.
    if (!d.open || d.querySelector('.pv-name').textContent !== name) return;
    d.querySelector('.pv-meta').textContent = fmtBytes(entry.bytes);
    body.innerHTML = renderPreviewBody(name, entry.text);
    body.scrollTop = 0;
  } catch (err) {
    body.innerHTML = `<div class="pv-note" style="color:var(--err)">Could not load ${esc(name)} — ${esc(err.message)}</div>`;
  }
}

/* Terminology assets get a lazily-loaded hierarchy browser: the CSV is
   up to ~1 MB, so it is fetched only when asked for, then cached. */
function renderTerminologyPanel(tk, name, version, vd) {
  if (tk !== 'terminologies' || !vd.files?.includes('terminology.csv')) return '';
  const path = `${tk}/${name}/${version}/terminology.csv`;
  return `<div class="term-panel" data-term="${esc(path)}">
    <div class="tree-bar">
      <button type="button" class="tree-btn" data-term-open>Browse hierarchy</button>
      <input class="tree-srch" placeholder="Find a structure…" hidden>
      <button type="button" class="tree-btn" data-tree-all hidden>Expand all</button>
      <span class="tree-meta"></span>
    </div>
    <div class="tree" hidden></div>
  </div>`;
}

/* Facet chips: clicking one filters the whole store by that value. */
function renderChips(vd) {
  const f = vd.facets || {};
  const out = [];
  for (const key of ['modality','institution','year']) {
    for (const value of (f[key]||[])) {
      const on = st.facet && st.facet.key===key && st.facet.value===value;
      const kLabel = key==='year' ? 'created' : key;
      out.push(`<button type="button" class="chip${on?' on':''}"
        data-facet="${esc(key)}" data-value="${esc(value)}" aria-pressed="${!!on}"
        title="Filter the store by ${esc(kLabel)}: ${esc(value)}">
        <span class="chip-k">${esc(kLabel)}</span>${esc(value)}</button>`);
    }
  }
  return out.length ? `<div class="chips">${out.join('')}</div>` : '';
}

function renderProv(dd) {
  const rows = [];
  const add = (k,v) => v && rows.push(
    `<div class="prow"><span class="pk">${esc(k)}</span><span class="pv">${v}</span></div>`);

  const inst = dd.institution || {};
  if (inst.name) {
    const ror = inst.registry_identifier;
    add('institution', ror
      ? `<a href="https://ror.org/${esc(ror)}" target="_blank" rel="noopener">${esc(inst.name)}</a>`
      : esc(inst.name));
  }
  add('project', dd.project_name ? esc(dd.project_name) : '');

  const people = (dd.investigators||[]).map(i=>{
    const oid = /ORCID/i.test(i.registry||'') ? i.registry_identifier : null;
    return oid
      ? `<a href="https://orcid.org/${esc(oid)}" target="_blank" rel="noopener">${esc(i.name)}</a>
         <span class="orcid">${esc(oid)}</span>`
      : esc(i.name);
  });
  if (people.length) add(people.length>1?'investigators':'investigator', people.join('<br>'));

  const funders = (dd.funding_source||[]).map(f=>{
    const fu = f.funder||{};
    const label = fu.abbreviation || fu.name || '';
    return f.grant_number ? `${esc(label)} <span class="orcid">${esc(f.grant_number)}</span>` : esc(label);
  }).filter(Boolean);
  if (funders.length) add(funders.length>1?'funders':'funder', funders.join(', '));

  if (dd.creation_time) {
    const d = new Date(dd.creation_time);
    add('created', isNaN(d) ? esc(dd.creation_time)
      : esc(d.toISOString().slice(0,10)));
  }
  // Multi-subject templates carry a comma list of specimen IDs.
  if (dd.subject_id) {
    const ids = String(dd.subject_id).split(',').map(s=>s.trim()).filter(Boolean);
    add(ids.length>1?`subjects (${ids.length})`:'subject',
      `<span style="font-family:'DM Mono',monospace;font-size:10.5px">${esc(ids.join(', '))}</span>`);
  }
  add('license', dd.license ? esc(dd.license) : '');
  add('name', dd.name
    ? `<span style="font-family:'DM Mono',monospace;font-size:10.5px;color:var(--ink-3)">${esc(dd.name)}</span>` : '');

  return rows.length ? `<div class="prov">${rows.join('')}</div>`
                     : '<span style="font-size:12px;color:var(--ink-3)">Empty</span>';
}

/* `described_by` names the spec page the manifest was written against, e.g.
   https://atlas-assets.readthedocs.io/en/v0.2.0/atlas.html → "v0.2.0 · atlas". */
function specLink(url) {
  const s = String(url);
  if (!/^https?:\/\//i.test(s)) return esc(s);
  const m = s.match(/\/en\/([^/]+)\/([^/?#]+?)(?:\.html)?(?:[?#].*)?$/);
  const label = m ? `${m[1]} · ${m[2]}` : s;
  return `<a class="loc loc-sm" href="${esc(s)}" target="_blank" rel="noopener"
    title="${esc(s)}">${esc(label)}</a>`;
}

/* Scales are voxel spacings in µm: a number when isotropic, a per-axis list
   when not (spec v0.2.1), e.g. [10, 25, [10, 10, 100]] → "10, 25, 10×10×100 µm". */
const fmtScales = scales => scales.length
  ? scales.map(s => Array.isArray(s) ? s.join('×') : String(s)).join(', ') + ' µm'
  : '';

function renderMf(m) {
  if (!m||typeof m!=='object') return '<span style="color:var(--ink-3);font-size:12px">Invalid manifest</span>';
  const rows=[];
  const kv=(k,v)=>rows.push(`<div class="kvrow"><span class="kvk">${esc(k)}</span><span class="kvv">${v}</span></div>`);
  // A manifest reference points at another asset in this store, and every
  // asset now has a page — so link it, but only when it really resolves.
  const ref = o => {
    if (!o) return '';
    const label = `${esc(o.name||'')}${o.version?`@${esc(o.version)}`:''}`;
    const path  = refPath(o);
    return (path && lookupVersion(path))
      ? `<a class="ref" href="#/${path.split('/').map(encodeURIComponent).join('/')}"
           title="Open ${esc(o.name||'')} ${esc(o.version||'')}">${label}</a>`
      : `<span class="ref ref-dead" title="Not present in this store">${label}</span>`;
  };

  if (m.schema_version)     kv('schema_version', esc(m.schema_version));
  if (m.described_by)       kv('described_by', specLink(m.described_by));
  if (m.coordinate_space)   kv('coordinate_space', ref(m.coordinate_space));
  if (m.templates?.length)  kv('templates', m.templates.map(ref).join(' '));
  if (m.annotation_sets?.length) kv('annotation_sets', m.annotation_sets.map(ref).join(' '));
  if (m.terminology)        kv('terminology', ref(m.terminology));
  if (m.template&&!m.templates) kv('template', ref(m.template));
  if (Array.isArray(m.origin)) kv('origin', esc(`[${m.origin.join(', ')}]`));
  if (m.scales?.length)     kv('scales', esc(fmtScales(m.scales)));
  if (m.input_template)     kv('input_template',  ref(m.input_template));
  if (m.output_template)    kv('output_template', ref(m.output_template));
  if (m.source)             kv('source', ref(m.source));
  if (m.target)             kv('target', ref(m.target));
  if (m.directionality)     kv('directionality', esc(m.directionality));
  if (m.location)           kv('location', locationLink(m.location, 'loc-sm'));
  if (!rows.length) {
    Object.entries(m).slice(0,6).forEach(([k,v])=>kv(k,`<span style="font-family:'DM Mono',monospace;font-size:10.5px">${esc(String(v))}</span>`));
  }
  return `<div class="mkv">${rows.join('')}</div>`;
}

function prog(msg) {
  const el = document.getElementById('prog-msg');
  if (el) el.textContent = msg;
}
function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Boot ────────────────────────────────────────────── */
document.getElementById('load-form').addEventListener('submit',e=>{e.preventDefault();load();});
installFacetDelegate();

// Served from inside a bucket? Describe that prefix instead of the default.
st.selfHost = detectSelfHosted(location.href);
if (st.selfHost) {
  const {bucket, prefix, region} = st.selfHost;
  document.getElementById('uri-in').value  = prefix ? `${bucket}/${prefix}` : bucket;
  document.getElementById('rgn-sel').value = region;
}

// A shared link may name a different store than this copy would pick.
const bootRoute = parseHash(location.hash);
if (bootRoute.store) document.getElementById('uri-in').value = bootRoute.store;

addEventListener('popstate', onHashChange);
addEventListener('hashchange', onHashChange);

load(bootRoute);
</script>
